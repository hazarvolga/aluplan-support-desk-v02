version: '3.9'

services:
  # ============================================
  # PostgreSQL with pgvector
  # ============================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aluplan_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: aluplan_support
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # Ollama — Local AI (CPU/GPU)
  # ============================================
  ollama:
    image: ollama/ollama:latest
    container_name: aluplan_ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    # Uncomment for GPU support:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # ============================================
  # Redis — For Background Jobs (BullMQ)
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: aluplan_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # ============================================
  # MinIO — Self-Hosted Object Storage
  # ============================================
  minio:
    image: minio/minio:latest
    container_name: aluplan_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-changeme}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  # ============================================
  # NestJS Backend
  # ============================================
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: aluplan_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-changeme}@postgres:5432/aluplan_support?schema=public
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      OLLAMA_BASE_URL: http://ollama:11434
      FRONTEND_URL: ${FRONTEND_URL}
      MAIL_PROVIDER: ${MAIL_PROVIDER:-resend}
      RESEND_API_KEY: ${RESEND_API_KEY}
      MAIL_FROM: ${MAIL_FROM}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-admin}
      STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-changeme}
      STORAGE_BUCKET: aluplan-storage
      STORAGE_USE_PATH_STYLE: "true"
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================
  # Next.js Frontend
  # ============================================
  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: aluplan_frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${BACKEND_URL:-http://backend:4000/api/v1}
    ports:
      - "3000:3000"
    depends_on:
      - backend

  # ============================================
  # Loki — Log Aggregation (receives pino-loki logs from backend)
  # ============================================
  loki:
    image: grafana/loki:2.9.5
    container_name: aluplan_loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki_data:/loki

  # ============================================
  # Tempo — Distributed Tracing (receives OTLP from NestJS)
  # ============================================
  tempo:
    image: grafana/tempo:2.4.1
    container_name: aluplan_tempo
    restart: unless-stopped
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./docker/tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data:/tmp/tempo
    ports:
      - "3200:3200"   # Tempo HTTP
      - "4318:4318"   # OTLP HTTP receiver

  # ============================================
  # Grafana — Dashboards (Loki + Tempo datasources)
  # ============================================
  grafana:
    image: grafana/grafana:10.4.3
    container_name: aluplan_grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3300:3000"
    depends_on:
      - loki
      - tempo

volumes:
  postgres_data:
  ollama_data:
  redis_data:
  minio_data:
  loki_data:
  tempo_data:
  grafana_data:
