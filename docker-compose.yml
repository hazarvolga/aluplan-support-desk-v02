services:
  # ============================================
  # PostgreSQL with pgvector (Persistent)
  # ============================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aluplan_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: aluplan_support
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    command: >
      postgres
      -c shared_preload_libraries='pg_stat_statements'
      -c pg_stat_statements.track=all
      -c pg_stat_statements.max=10000
      -c log_min_duration_statement=500
      -c log_line_prefix='%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - aluplan_net

  # ============================================
  # Redis — For Background Jobs (BullMQ)
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: aluplan_redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --save 900 1
      --save 300 10
      --save 60 10000
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - aluplan_net

  # ============================================
  # NestJS Backend (Production Ready)
  # BullMQ workers run in-process (no separate worker container needed)
  # ============================================
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: aluplan_backend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-4000}
      # Database
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      # Auth
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      # App
      FRONTEND_URL: ${FRONTEND_URL:?set FRONTEND_URL}
      API_URL: ${API_URL:?set public backend API_URL, e.g. https://api.example.com/api/v1}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?set ALLOWED_ORIGINS}
      # Redis / BullMQ
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      # Storage (Cloudflare R2 / S3)
      STORAGE_TYPE: ${STORAGE_TYPE:-S3}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-}
      STORAGE_PUBLIC_ENDPOINT: ${STORAGE_PUBLIC_ENDPOINT:-}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-aluplan-storage}
      STORAGE_USE_PATH_STYLE: "true"
      # Email
      MAIL_PROVIDER: ${MAIL_PROVIDER:-resend}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-destek@allplan.net.tr}
      # AI
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_CHAT_MODEL: ${GEMINI_CHAT_MODEL:-gemini-2.5-flash}
      GEMINI_EMBED_MODEL: ${GEMINI_EMBED_MODEL:-gemini-embedding-2}
      LLMAPI_API_KEY: ${LLMAPI_API_KEY:-}
      LLMAPI_BASE_URL: ${LLMAPI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai}
      LLMAPI_CHAT_MODEL: ${LLMAPI_CHAT_MODEL:-gemini-2.5-flash}
      LLMAPI_EMBED_MODEL: ${LLMAPI_EMBED_MODEL:-gemini-embedding-2}
      CHAT_PROVIDER: ${CHAT_PROVIDER:-GEMINI}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-gemini-embedding-2}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-OPENAI}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-3072}
      GENERATIVE_MODEL: ${GENERATIVE_MODEL:-gemini-2.5-flash}
      # Vector / RAG
      VECTOR_DIMENSIONS: ${VECTOR_DIMENSIONS:-3072}
      SIMILARITY_THRESHOLD_HIGH: ${SIMILARITY_THRESHOLD_HIGH:-0.75}
      SIMILARITY_THRESHOLD_MEDIUM: ${SIMILARITY_THRESHOLD_MEDIUM:-0.70}
      KNOWLEDGE_SYNC_QUEUE_CONCURRENCY: ${KNOWLEDGE_SYNC_QUEUE_CONCURRENCY:-1}
      KNOWLEDGE_SYNC_RATE_MAX: ${KNOWLEDGE_SYNC_RATE_MAX:-1}
      KNOWLEDGE_SYNC_RATE_DURATION_MS: ${KNOWLEDGE_SYNC_RATE_DURATION_MS:-30000}
      KNOWLEDGE_SYNC_BULK_DELAY_MS: ${KNOWLEDGE_SYNC_BULK_DELAY_MS:-15000}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY}
      # CRM
      CRM_DELTA_SYNC_INTERVAL: "${CRM_DELTA_SYNC_INTERVAL:-*/5 * * * *}"
      # Swagger
      SWAGGER_PASSWORD: ${SWAGGER_PASSWORD:-}
      # Monitoring
      SENTRY_ENABLED: ${SENTRY_ENABLED:-false}
      # Security
      ADMIN_BYPASS_EMAILS: ${ADMIN_BYPASS_EMAILS:?set ADMIN_BYPASS_EMAILS}
    ports:
      - "${PORT:-4000}:${PORT:-4000}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${PORT:-4000}/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - aluplan_net

  # ============================================
  # Next.js Frontend (Build Optimized)
  # ============================================
  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?set NEXT_PUBLIC_API_URL}
    container_name: aluplan_frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?set NEXT_PUBLIC_API_URL}
      NEXT_INTERNAL_API_URL: ${NEXT_INTERNAL_API_URL:-http://aluplan_backend:4000/api/v1}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - aluplan_net

networks:
  aluplan_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
