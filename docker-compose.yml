version: '3.9'

services:
  # ============================================
  # PostgreSQL with pgvector (Persistent)
  # ============================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aluplan_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: aluplan_support
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aluplan_net

  # ============================================
  # Redis — For Background Jobs (BullMQ)
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: aluplan_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - aluplan_net

  # ============================================
  # MinIO — Self-Hosted Object Storage (Permanent)
  # ============================================
  minio:
    image: minio/minio:latest
    container_name: aluplan_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-changeme}
    ports:
      - "9001:9001" # MinIO Console
    volumes:
      - minio_data:/data
    networks:
      - aluplan_net

  # ============================================
  # NestJS Backend (Production Ready)
  # ============================================
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: aluplan_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: ${PORT:-3001}
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      FRONTEND_URL: ${FRONTEND_URL}
      REDIS_URL: ${REDIS_URL}
      STORAGE_TYPE: ${STORAGE_TYPE:-S3}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-http://minio:9000}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-admin}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-changeme}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-aluplan-storage}
      STORAGE_USE_PATH_STYLE: "true"
      # AI Strategic Keys
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      GENERATIVE_MODEL: ${GENERATIVE_MODEL:-llama-3.3-70b-versatile}
    ports:
      - "${PORT:-3001}:${PORT:-3001}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${PORT:-3001}/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - aluplan_net

  # ============================================
  # Next.js Frontend (Build Optimized)
  # ============================================
  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: aluplan_frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - aluplan_net

networks:
  aluplan_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
