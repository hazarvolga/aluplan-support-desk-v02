version: '3.9'

services:
  postgres-test:
    image: pgvector/pgvector:pg16
    container_name: aluplan_postgres_test
    environment:
      POSTGRES_DB: aluplan_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: testpassword
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis-test:
    image: redis:7-alpine
    container_name: aluplan_redis_test
    ports:
      - "6380:6379"
