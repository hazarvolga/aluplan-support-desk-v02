name: AI Evaluation (promptfoo)

on:
  schedule:
    - cron: '0 3 * * *' # Every day at 3 AM UTC
  workflow_dispatch: # Manual trigger

jobs:
  evaluate:
    name: AI Pipeline Quality Evaluation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.3'

      - name: Install promptfoo
        run: npm install -g promptfoo

      - name: Run Evaluation
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          cd scripts/ai-eval
          npx promptfoo eval --config promptfooconfig.ts --output results.json

      - name: Upload Results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ai-eval-results
          path: scripts/ai-eval/results.json

      - name: Check Thresholds
        run: |
          cd scripts/ai-eval
          npx promptfoo eval --config promptfooconfig.ts --threshold 0.7
