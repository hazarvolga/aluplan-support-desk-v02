name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - "apps/backend/**"
      - "packages/**"
  pull_request:
    branches: [main, develop]
    paths:
      - "apps/backend/**"
      - "packages/**"

jobs:
  test:
    name: Backend Unit & Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: aluplan_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11.17.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.23.3"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @aluplan/database db:generate

      - name: Generate disposable test credentials
        run: |
          node - <<'NODE' >> "$GITHUB_ENV"
          const { randomBytes } = require('node:crypto');
          for (const name of ['JWT_SECRET', 'JWT_REFRESH_SECRET', 'AUTH_ACTION_JWT_SECRET', 'ENCRYPTION_KEY']) {
            process.stdout.write(`${name}=${randomBytes(32).toString('hex')}\n`);
          }
          NODE

      - name: Lint
        run: pnpm --filter @aluplan/backend lint

      - name: Run Unit Tests with Coverage
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:testpassword@localhost:5433/aluplan_test?schema=public
          REDIS_URL: redis://localhost:6380
          NODE_OPTIONS: "--experimental-vm-modules --no-warnings"
        run: pnpm --filter @aluplan/backend test:cov

      - name: Check Coverage Gate (50/40/50/50 minimum)
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:testpassword@localhost:5433/aluplan_test?schema=public
          REDIS_URL: redis://localhost:6380
          NODE_OPTIONS: "--experimental-vm-modules --no-warnings"
        run: |
          pnpm --filter @aluplan/backend exec jest \
            --coverage \
            --coverageThreshold='{"global":{"lines":50,"branches":40,"functions":50,"statements":50}}'

      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-coverage
          path: apps/backend/coverage/

  e2e:
    name: Backend E2E Tests
    runs-on: ubuntu-latest
    needs: [test]
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: aluplan_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11.17.0
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.23.3"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma Client
        run: pnpm --filter @aluplan/database db:generate
      - name: Prepare isolated CI database
        env:
          DATABASE_URL: postgresql://postgres:testpassword@localhost:5433/aluplan_test?schema=public
        run: pnpm exec prisma migrate deploy --config packages/database/prisma.config.js
      - name: Generate disposable test credentials
        run: |
          node - <<'NODE' >> "$GITHUB_ENV"
          const { randomBytes } = require('node:crypto');
          for (const name of ['JWT_SECRET', 'JWT_REFRESH_SECRET', 'AUTH_ACTION_JWT_SECRET', 'ENCRYPTION_KEY']) {
            process.stdout.write(`${name}=${randomBytes(32).toString('hex')}\n`);
          }
          NODE
      - name: Verify E2E database target guard
        run: node --test apps/backend/test/e2e-db-guard.test.cjs
      - name: Run E2E Tests
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:testpassword@localhost:5433/aluplan_test?schema=public
          BACKEND_E2E_DISPOSABLE_DB: aluplan-test-ephemeral
          REDIS_URL: redis://localhost:6380
          ADMIN_BYPASS_EMAILS: e2e-admin@aluplan.test
          FRONTEND_URL: http://localhost:3000
          NODE_OPTIONS: "--experimental-vm-modules --no-warnings"
        # Capture jest output and fail if `Tests: 0 total` appears.
        # Pre-`@swc/jest` migration the integration suite would silently
        # exit 0 with zero tests due to `--forceExit` masking OOM crashes.
        run: |
          set -o pipefail
          # The customer-security rehearsal requires a separate guarded
          # 127.0.0.1:55434 database. It is NOT covered by this generic job;
          # keep its isolated execution as an explicit release gate.
          pnpm --filter @aluplan/backend exec jest --config ./test/jest-e2e.json \
            --runInBand --forceExit \
            --testPathIgnorePatterns='integration/customer-security-rehearsal.integration.spec.ts' \
            2>&1 | tee /tmp/be-e2e.log
          if grep -qE 'Tests: *0 total' /tmp/be-e2e.log; then
            echo "::error::Backend E2E ran zero tests — suite is broken"
            exit 1
          fi
