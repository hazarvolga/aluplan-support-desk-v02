name: Disaster Recovery Safety Contract (not restore evidence)

on:
  schedule:
    - cron: '0 3 1 */3 *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safety-contract:
    name: A.1.3 fail-closed contract tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Verify A.1.3 safety contract
        run: node --test scripts/release-a13-safety.test.mjs

      - name: Clarify evidence boundary
        run: |
          echo 'This workflow validates code safety only.'
          echo 'It is not restore evidence and cannot authorize production deployment.'
