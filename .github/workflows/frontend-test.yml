name: Frontend Static & Unit CI

# Full Playwright coverage is owned by CI Quality Gate, where PostgreSQL,
# Redis, migrations, synthetic users, backend and frontend are provisioned.

on:
  push:
    branches: [main, develop]
    paths:
      - "apps/frontend/**"
  pull_request:
    branches: [main, develop]
    paths:
      - "apps/frontend/**"

jobs:
  unit:
    name: Frontend Unit Tests (Vitest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.3"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Unit Tests with Coverage
        run: pnpm --filter @aluplan/frontend test:unit:cov

      - name: Lint
        run: pnpm --filter @aluplan/frontend lint

      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-unit-coverage
          path: apps/frontend/coverage/
