name: Frontend CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'apps/frontend/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'apps/frontend/**'

jobs:
  unit:
    name: Frontend Unit Tests (Vitest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter @aluplan/frontend lint

      - name: Run Unit Tests with Coverage
        run: pnpm --filter @aluplan/frontend test:unit:cov

      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-unit-coverage
          path: apps/frontend/coverage/

  e2e:
    name: Frontend E2E Tests (Playwright)
    runs-on: ubuntu-latest
    # E2E depends on a running backend+frontend — only runs on main
    if: github.ref == 'refs/heads/main'
    needs: [unit]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Browsers
        run: pnpm --filter @aluplan/frontend exec playwright install --with-deps chromium

      - name: Build Frontend
        run: pnpm --filter @aluplan/frontend build

      # Sanity check: catch syntax errors in spec files before launching the
      # full suite. `--list` does discovery only; if a spec fails to parse,
      # this exits non-zero. Without this, a SyntaxError can silently cause
      # `playwright test` to skip everything but still exit 0 on some setups.
      - name: Verify Playwright suite is discoverable
        run: |
          set -e
          cd apps/frontend
          discovered=$(pnpm exec playwright test --list --reporter=list 2>&1 | tail -1)
          echo "$discovered"
          if ! echo "$discovered" | grep -qE 'Total: [1-9][0-9]* test'; then
            echo "::error::Playwright discovered no tests — check for spec file syntax errors"
            exit 1
          fi

      - name: Run E2E Tests
        run: pnpm --filter @aluplan/frontend test:e2e
        env:
          CI: true
          NEXT_PUBLIC_API_URL: ${{ vars.STAGING_API_URL || 'http://localhost:4000' }}

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/frontend/playwright-report/
