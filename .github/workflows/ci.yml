name: CI Quality Gate

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  NODE_VERSION: 20
  PNPM_VERSION: 9

jobs:
  spec-verify:
    name: Spec ↔ Code Consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Verify spec ↔ code consistency
        run: node scripts/verify-specs.mjs
        env:
          SPEC_VERIFY_STRICT: '0'

  security:
    name: Security & Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Secret Scanning (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm install
      - name: Pnpm Audit
        run: pnpm audit --prod --audit-level high

  typecheck-and-build:
    name: Build (Backend & Frontend)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aluplan_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aluplan_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aluplan_ci
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aluplan_shadow
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install
      - name: Prisma Generate
        run: npx prisma generate
      - name: Create Prisma shadow database
        run: |
          node - <<'NODE'
          const { Client } = require('pg');

          async function main() {
            const client = new Client({ connectionString: process.env.DATABASE_URL });
            await client.connect();
            const exists = await client.query("SELECT 1 FROM pg_database WHERE datname = 'aluplan_shadow'");
            if (exists.rowCount === 0) {
              await client.query('CREATE DATABASE aluplan_shadow');
            }
            await client.end();
          }

          main().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
      - name: Prisma Migration Check (blocking)
        run: cd packages/database && pnpm exec prisma migrate diff --from-migrations prisma/migrations --to-schema prisma/schema.prisma --shadow-database-url "$SHADOW_DATABASE_URL" --script --exit-code
      - name: Build Backend
        run: cd apps/backend && pnpm run build
      - name: Build Frontend
        run: cd apps/frontend && pnpm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
      - name: Analyze Frontend Bundle
        run: cd apps/frontend && pnpm run analyze
      - name: Upload Bundle Analysis
        uses: actions/upload-artifact@v4
        with:
          name: bundle-analysis
          path: apps/frontend/.next/analyze/

  testing:
    name: Tests & Coverage
    runs-on: ubuntu-latest
    needs: typecheck-and-build
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install
      - name: Prisma Generate
        run: npx prisma generate
      - name: Run Backend Tests
        run: cd apps/backend && pnpm test -- --coverage
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
           token: ${{ secrets.CODECOV_TOKEN }}

  e2e:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    needs: typecheck-and-build
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Run E2E Tests
        run: cd apps/frontend && npx playwright test
      - name: Upload E2E Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/frontend/playwright-report/

  docker-build:
    name: Docker Build & Scan
    runs-on: ubuntu-latest
    needs: typecheck-and-build
    steps:
      - uses: actions/checkout@v4
      - name: Build Backend Container
        run: docker build -t aluplan-backend -f apps/backend/Dockerfile .
      - name: Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'aluplan-backend:latest'
          format: 'table'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [spec-verify, testing, e2e, docker-build]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Coolify Staging Webhook
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_STAGING_WEBHOOK }}
        run: |
          if [ -z "$COOLIFY_WEBHOOK" ]; then
            echo "⚠️ COOLIFY_STAGING_WEBHOOK not set. Skipping staging deploy."
            echo "To enable: Coolify → Project → Webhook → Add to GitHub Secrets"
            exit 0
          fi
          curl -X POST "$COOLIFY_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d '{"branch":"main","commit":"'"${{ github.sha }}"'"}' \
            --fail-with-body || echo "Webhook failed — check Coolify staging stack"
          echo "✅ Staging deployment triggered for commit ${{ github.sha }}"
